name: Validate image assets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/validate_images.py
      # The daily sync rebuilds the manifest instead of reusing it; fail here,
      # not a day later, when that rebuild would leave committed media unlisted.
      - run: python scripts/build_artwork_variants.py --verify
